{% extends "portal/base.html" %}{% from "macros.html" import csrf %}{% block body %}<h2>Profile</h2><div class="row" style="align-items:flex-start">
<form method="post" class="card">{{ csrf() }}<input type="hidden" name="action" value="profile"><b>Details</b><label>Username</label><input value="{{ c.username }}" disabled><label>Name</label><input name="name" value="{{ c.name }}" required><label>Email</label><input name="email" value="{{ c.email }}"><label>Address</label><input name="address" value="{{ c.address }}"><p><button>Save</button></p></form>
<form method="post" class="card">{{ csrf() }}<input type="hidden" name="action" value="password"><b>Change password</b><label>Current password</label><input type="password" name="current" required><label>New password</label><input type="password" name="new" required minlength="6"><label>Confirm</label><input type="password" name="confirm" required><p><button>Change</button></p></form></div>{% endblock %}
