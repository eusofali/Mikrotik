{% extends "portal/base.html" %}{% from "macros.html" import badge, csrf %}{% block body %}<h2>Support</h2>
<form method="post" class="card">{{ csrf() }}<b>New ticket</b><div class="row"><div style="flex:3"><label>Subject</label><input name="subject" required></div><div><label>Category</label><select name="category"><option>general</option><option>billing</option><option>technical</option><option>speed</option></select></div></div><label>Message</label><textarea name="body" rows="3" required></textarea><p><button>Submit</button></p></form>
<div class="card"><table><tr><th>#</th><th>Subject</th><th>Status</th><th>Updated</th></tr>{% for t in tickets %}<tr><td><a href="{{ url_for('portal.ticket', tid=t.id) }}">{{ t.id }}</a></td><td>{{ t.subject }}</td><td>{{ badge(t.status) }}</td><td>{{ t.updated_at|dt }}</td></tr>{% endfor %}</table></div>{% endblock %}
