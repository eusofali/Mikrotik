{% extends "base.html" %}{% from "macros.html" import badge %}{% block body %}<div class="top"><h2>Support tickets</h2><form method="get"><select name="status" onchange="this.form.submit()"><option value="">All</option>{% for s in ['open','pending','closed'] %}<option {{ 'selected' if s==status }}>{{ s }}</option>{% endfor %}</select></form></div>
<div class="card"><table><tr><th>#</th><th>Customer</th><th>Subject</th><th>Category</th><th>Status</th><th>Updated</th></tr>{% for t in rows %}<tr><td><a href="{{ url_for('staff.ticket', tid=t.id) }}">{{ t.id }}</a></td><td>{{ t.customer.username }}</td><td>{{ t.subject }}</td><td>{{ t.category }}</td><td>{{ badge(t.status) }}</td><td>{{ t.updated_at|dt }}</td></tr>{% endfor %}</table></div>{% endblock %}
